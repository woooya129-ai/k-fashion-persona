name: Agent Team Config

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - AGENTS.md
      - .codex/**
      - .agents/**
      - scripts/automation/check_codex_team_config.py
      - .github/workflows/agent-team-config.yml

permissions:
  contents: read

concurrency:
  group: agent-team-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Codex team config
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate custom agents and skills
        run: python scripts/automation/check_codex_team_config.py

      - name: Compile automation scripts
        run: python -m compileall -q scripts
