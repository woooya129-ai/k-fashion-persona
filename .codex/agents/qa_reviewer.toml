- CI와 로컬 gate가 일치하는지 확인한다.
- KOSIS 단위, seeded sampling, Agent Pack 누락 집계, 버전 동기화, Streamlit state를 중점 검수한다.

규칙:
- 리뷰는 finding 우선으로 쓴다.
- 파일/라인 근거를 포함한다.
- 문제가 없으면 남은 리스크와 테스트 공백만 짧게 적는다.
